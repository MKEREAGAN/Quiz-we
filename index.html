<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Wɛ</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <div id="accueil">

        <h1>🎮 Quiz Wɛ</h1>

        <p>Apprends le vocabulaire Wɛ en jouant !</p>

        <h2>Choisis un thème</h2>

        <label for="theme">Sélectionne un thème :</label>
        <select id="theme" aria-label="Sélection du thème">
            <option value="Tous">Tous les thèmes</option>
            <option value="Animaux">Animaux</option>
            <option value="Famille">Famille</option>
            <option value="Nature">Nature</option>
            <option value="Nourriture">Nourriture</option>
            <option value="Corps">Corps</option>
            <option value="Maison">Maison</option>
            <option value="Spiritualité">Spiritualité</option>
            <option value="Éducation">Éducation</option>
            <option value="Nombres">Nombres</option>
        </select>

        <br><br>

        <button id="commencer">▶ Commencer</button>

    </div>

    <div id="quiz" style="display:none;">

        <div id="barre-container">
            <div id="barre" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
        </div>

        <p id="progression" aria-live="polite" aria-atomic="true"></p>

        <button id="parler" aria-label="Écouter la prononciation">🔊 Prononcer</button>

        <h2 id="question"></h2>

        <p id="message" aria-live="polite"></p>

        <button class="reponse"></button>
        <button class="reponse"></button>
        <button class="reponse"></button>
        <button class="reponse"></button>

    </div>

    <div id="score" role="status" aria-live="polite" aria-atomic="true"></div>

    <script src="mots.js"></script>
    <script src="script.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js')
                .catch(err => console.warn('Service Worker registration failed:', err));
        }
    </script>

</body>
</html>
